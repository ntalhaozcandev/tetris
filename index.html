<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tetris</title>
    
    <!-- PWA & Mobile Meta -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <meta name="theme-color" content="#00f5ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tetris" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #040408;
        overflow: hidden;
        height: 100dvh;
        width: 100vw;
        position: fixed;
      }
    </style>
    
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .then((reg) => {
              console.log("SW Registered:", reg.scope);
              
              // Periyodik kontrol (isteğe bağlı, örn. her 1 saatte bir)
              setInterval(() => {
                reg.update();
              }, 60 * 60 * 1000);
            })
            .catch((err) => console.error("SW Registration failed:", err));
        });

        // Yeni bir Service Worker aktif olduğunda sayfayı yenile
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-B0hGCAz8.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
